<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Career Agent Executive Dashboard</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #0f172a;
      --accent: #22c55e;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="p-3 sm:p-5 max-w-md mx-auto">
  
  <!-- Header Card -->
  <header class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 mb-4 shadow-lg">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-[var(--foreground)] tracking-tight">Career Agent Digest</h1>
        <p class="text-xs text-[var(--muted-foreground)] font-medium" id="header-subtitle">Sylvester Floyd Carter IV</p>
      </div>
      <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Structured API
      </span>
    </div>
    
    <!-- Quick Stats Grid -->
    <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-[var(--border)]">
      <div class="text-center">
        <div class="text-xl font-extrabold text-[var(--primary)]" id="stat-scanned">--</div>
        <div class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Scanned</div>
      </div>
      <div class="text-center">
        <div class="text-xl font-extrabold text-emerald-400" id="stat-matches">--</div>
        <div class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Auto-Apply</div>
      </div>
      <div class="text-center">
        <div class="text-xl font-extrabold text-amber-400" id="stat-review">--</div>
        <div class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Review</div>
      </div>
    </div>
  </header>

  <!-- Filter Pills -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1 text-xs font-semibold">
    <button onclick="filterCategory('all')" id="btn-all" class="filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all">All Target Roles</button>
    <button onclick="filterCategory('AUTO_APPLY')" id="btn-auto" class="filter-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-full transition-all">Auto-Apply (≥80%)</button>
    <button onclick="filterCategory('REVIEW')" id="btn-rev" class="filter-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-full transition-all">Review (65–79%)</button>
  </div>

  <!-- Loading Indicator -->
  <div id="loading" class="text-center py-8 space-y-2">
    <div class="inline-block w-6 h-6 border-2 border-[var(--primary)] border-t-transparent rounded-full animate-spin"></div>
    <div class="text-xs text-[var(--muted-foreground)]">Fetching structured AI career digest...</div>
  </div>

  <!-- Job Opportunities List Container -->
  <main id="job-list" class="space-y-4 hidden">
    <!-- Rendered dynamically -->
  </main>

  <footer class="mt-6 text-center text-xs text-[var(--muted-foreground)] py-4 border-t border-[var(--border)]">
    Sylvester's Autonomous Career Agent • Live API Engine
  </footer>

  <script>
    let currentJobs = [];
    let currentFilter = 'all';

    async function fetchDigest() {
      try {
        const res = await fetch('/api/digest');
        const data = await res.json();
        if (data.email) {
          document.getElementById('header-subtitle').innerText = `${data.candidate} (${data.email})`;
        }
        document.getElementById('stat-scanned').innerText = data.scanned_count || '0';
        currentJobs = data.jobs || [];
        renderDashboard();
      } catch (err) {
        console.error("API Fetch error:", err);
        document.getElementById('loading').innerHTML = '<div class="text-xs text-rose-400 p-4 border border-rose-500/20 bg-rose-500/10 rounded-xl">API connection loading... Tap Refresh on your browser.</div>';
      }
    }

    function renderDashboard() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('job-list').classList.remove('hidden');

      let autoCount = 0;
      let revCount = 0;

      currentJobs.forEach(j => {
        if (j.recommendation === 'AUTO_APPLY') autoCount++;
        if (j.recommendation === 'REVIEW') revCount++;
      });

      document.getElementById('stat-matches').innerText = autoCount;
      document.getElementById('stat-review').innerText = revCount;

      const filtered = currentJobs.filter(j => {
        if (currentFilter === 'all') return true;
        return j.recommendation === currentFilter;
      });

      const container = document.getElementById('job-list');
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-xs text-[var(--muted-foreground)]">No matching positions found for this filter.</div>';
        return;
      }

      filtered.forEach((job, idx) => {
        const card = createCard(job, idx);
        container.appendChild(card);
      });
    }

    function createCard(job, idx) {
      const card = document.createElement('div');
      const isAuto = job.recommendation === 'AUTO_APPLY';
      const badgeBg = isAuto ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30';
      const progressBg = isAuto ? 'bg-emerald-400' : 'bg-amber-400';

      card.className = "bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-md space-y-3";
      
      const proofsHtml = (job.matched_proofs || []).map(p => `<span class="bg-[var(--border)] text-[var(--foreground)] px-2 py-0.5 rounded">${p}</span>`).join(' ');

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div>
            <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500/10 text-sky-400 border border-sky-500/20 mb-1">${job.company}</span>
            <h2 class="text-base font-bold text-[var(--foreground)] leading-snug">${job.title}</h2>
            <p class="text-xs text-[var(--muted-foreground)] font-medium">${job.estimated_tc} • ${job.location}</p>
          </div>
          <span class="shrink-0 text-xs font-extrabold px-2.5 py-1 rounded-full border ${badgeBg}">${job.score}% Fit</span>
        </div>

        <div>
          <div class="w-full bg-[var(--border)] h-1.5 rounded-full overflow-hidden">
            <div class="${progressBg} h-full rounded-full" style="width: ${job.score}%"></div>
          </div>
        </div>

        <div class="flex flex-wrap gap-1 text-[10px]">
          ${proofsHtml}
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-1.5 pt-2 border-t border-[var(--border)] text-[11px] font-semibold overflow-x-auto">
          <button onclick="switchTab('tab-outreach-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} active text-sky-400 border-b-2 border-sky-400 pb-1">Direct InMail</button>
          <button onclick="switchTab('tab-resume-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} text-[var(--muted-foreground)] hover:text-white pb-1">Full Resume</button>
          <button onclick="switchTab('tab-cover-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} text-[var(--muted-foreground)] hover:text-white pb-1">Cover Letter</button>
          <button onclick="switchTab('tab-brief-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} text-[var(--muted-foreground)] hover:text-white pb-1">Agent Brief</button>
        </div>

        <!-- Tab Contents -->
        <div id="card-${idx}" class="pt-2">
          
          <div id="tab-outreach-${idx}" class="tab-content active space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-[var(--muted-foreground)]">
              <span>Target: <strong class="text-sky-400">${job.contact_target || 'Hiring Manager'}</strong></span>
              <button onclick="copyText('inmail-${idx}', this)" class="bg-emerald-500 text-slate-950 font-bold px-2.5 py-1 rounded text-[11px] hover:bg-emerald-400">Copy InMail</button>
            </div>
            <textarea id="inmail-${idx}" readonly class="w-full bg-slate-900 text-slate-200 p-2.5 rounded-xl border border-[var(--border)] font-mono text-[11px] leading-relaxed h-28 focus:outline-none">${job.inmail_text || ''}</textarea>
          </div>

          <div id="tab-resume-${idx}" class="tab-content space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-[var(--muted-foreground)]">
              <span>ATS Modified Resume</span>
              <button onclick="copyText('resume-${idx}', this)" class="bg-sky-500 text-slate-950 font-bold px-2.5 py-1 rounded text-[11px] hover:bg-sky-400">Copy Full Resume</button>
            </div>
            <textarea id="resume-${idx}" readonly class="w-full bg-slate-900 text-slate-200 p-2.5 rounded-xl border border-[var(--border)] font-mono text-[10px] leading-relaxed h-44 focus:outline-none">${job.full_resume || ''}</textarea>
          </div>

          <div id="tab-cover-${idx}" class="tab-content space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-[var(--muted-foreground)]">
              <span>Human Cover Letter</span>
              <button onclick="copyText('cover-${idx}', this)" class="bg-purple-500 text-white font-bold px-2.5 py-1 rounded text-[11px] hover:bg-purple-400">Copy Cover Letter</button>
            </div>
            <textarea id="cover-${idx}" readonly class="w-full bg-slate-900 text-slate-200 p-2.5 rounded-xl border border-[var(--border)] font-mono text-[10px] leading-relaxed h-44 focus:outline-none">${job.full_cover_letter || ''}</textarea>
          </div>

          <div id="tab-brief-${idx}" class="tab-content space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-purple-300">
              <span>Translucent Agent Alignment Brief</span>
              <button onclick="copyText('brief-${idx}', this)" class="bg-purple-600 text-white font-bold px-2.5 py-1 rounded text-[11px] hover:bg-purple-500">Copy Agent Note</button>
            </div>
            <textarea id="brief-${idx}" readonly class="w-full bg-slate-950 text-purple-200 p-2.5 rounded-xl border border-purple-500/30 font-mono text-[10px] leading-relaxed h-28 focus:outline-none">${job.translucent_note || ''}</textarea>
          </div>

        </div>
      `;
      return card;
    }

    function switchTab(tabId, btn, cardContainerId) {
      const container = document.getElementById(cardContainerId);
      if (!container) return;
      
      const contents = container.querySelectorAll('.tab-content');
      contents.forEach(c => c.classList.remove('active'));
      
      const btns = btn.parentElement.querySelectorAll('button');
      btns.forEach(b => {
        b.classList.remove('active', 'text-sky-400', 'border-b-2', 'border-sky-400');
        b.classList.add('text-[var(--muted-foreground)]');
      });

      btn.classList.add('active', 'text-sky-400', 'border-b-2', 'border-sky-400');
      btn.classList.remove('text-[var(--muted-foreground)]');

      const targetTab = document.getElementById(tabId);
      if (targetTab) targetTab.classList.add('active');
    }

    function copyText(id, btn) {
      const textarea = document.getElementById(id);
      if (textarea) {
        textarea.select();
        document.execCommand('copy');
        const origText = btn.innerText;
        btn.innerText = 'Copied! ✓';
        setTimeout(() => { btn.innerText = origText; }, 2000);
      }
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-[var(--primary)]', 'text-[var(--primary-foreground)]');
        b.classList.add('bg-[var(--card)]', 'text-[var(--muted-foreground)]');
      });
      
      if (cat === 'all') document.getElementById('btn-all').className = 'filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all';
      if (cat === 'AUTO_APPLY') document.getElementById('btn-auto').className = 'filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all';
      if (cat === 'REVIEW') document.getElementById('btn-rev').className = 'filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all';

      renderDashboard();
    }

    fetchDigest();
  </script>
</body>
</html>
