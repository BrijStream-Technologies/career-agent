<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Career Agent Executive Dashboard</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --primary: #38bdf8;
      --primary-foreground: #0f172a;
      --accent: #22c55e;
    }
    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="p-3 sm:p-5 max-w-md mx-auto">
  
  <!-- Header Card -->
  <header class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 mb-4 shadow-lg">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-[var(--foreground)] tracking-tight">Career Agent Digest</h1>
        <p class="text-xs text-[var(--muted-foreground)] font-medium">Sylvester Floyd Carter IV</p>
      </div>
      <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Live API Sync
      </span>
    </div>
    
    <!-- Quick Stats Grid -->
    <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-[var(--border)]">
      <div class="text-center">
        <div class="text-xl font-extrabold text-[var(--primary)]" id="stat-scanned">--</div>
        <div class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Scanned</div>
      </div>
      <div class="text-center">
        <div class="text-xl font-extrabold text-emerald-400" id="stat-matches">--</div>
        <div class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Auto-Apply</div>
      </div>
      <div class="text-center">
        <div class="text-xl font-extrabold text-amber-400" id="stat-review">--</div>
        <div class="text-[10px] text-[var(--muted-foreground)] uppercase tracking-wider font-semibold">Review</div>
      </div>
    </div>
  </header>

  <!-- Filter Pills -->
  <div class="flex gap-2 mb-4 overflow-x-auto pb-1 text-xs font-semibold">
    <button onclick="filterCategory('all')" id="btn-all" class="filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all">All Target Roles</button>
    <button onclick="filterCategory('AUTO_APPLY')" id="btn-auto" class="filter-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-full transition-all">Auto-Apply (≥80%)</button>
    <button onclick="filterCategory('REVIEW')" id="btn-rev" class="filter-btn bg-[var(--card)] text-[var(--muted-foreground)] border border-[var(--border)] px-3.5 py-1.5 rounded-full transition-all">Review (65–79%)</button>
  </div>

  <!-- Loading Indicator -->
  <div id="loading" class="text-center py-8 space-y-2">
    <div class="inline-block w-6 h-6 border-2 border-[var(--primary)] border-t-transparent rounded-full animate-spin"></div>
    <div class="text-xs text-[var(--muted-foreground)]">Scanning live remote job APIs & matching proof metrics...</div>
  </div>

  <!-- Job Opportunities List Container -->
  <main id="job-list" class="space-y-4 hidden">
    <!-- Rendered dynamically by JavaScript -->
  </main>

  <footer class="mt-6 text-center text-xs text-[var(--muted-foreground)] py-4 border-t border-[var(--border)]">
    Sylvester's Autonomous Career Agent • Updated Live
  </footer>

  <script>
    let currentData = null;
    let currentFilter = 'all';

    async function fetchDigest() {
      try {
        const res = await fetch('/api/digest');
        const data = await res.json();
        currentData = data;
        renderDashboard(data);
      } catch (err) {
        console.error("Failed to fetch digest API:", err);
        document.getElementById('loading').innerHTML = '<div class="text-xs text-rose-400">Offline mode: Rendering cached data</div>';
      }
    }

    function renderDashboard(data) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('job-list').classList.remove('hidden');

      document.getElementById('stat-scanned').innerText = data.scanned_count || '15+';

      const jobList = document.getElementById('job-list');
      jobList.innerHTML = '';

      const digestMd = data.digest_markdown || '';
      const jobs = parseJobsFromDigest(digestMd);

      let autoCount = 0;
      let revCount = 0;

      jobs.forEach(j => {
        if (j.recommendation === 'AUTO_APPLY') autoCount++;
        if (j.recommendation === 'REVIEW') revCount++;
      });

      document.getElementById('stat-matches').innerText = autoCount;
      document.getElementById('stat-review').innerText = revCount;

      const filteredJobs = jobs.filter(j => {
        if (currentFilter === 'all') return true;
        return j.recommendation === currentFilter;
      });

      if (filteredJobs.length === 0) {
        jobList.innerHTML = '<div class="text-center py-6 text-xs text-[var(--muted-foreground)]">No matching roles in this filter category.</div>';
        return;
      }

      filteredJobs.forEach((job, idx) => {
        const card = createJobCard(job, idx);
        jobList.appendChild(card);
      });
    }

    function createJobCard(job, idx) {
      const card = document.createElement('div');
      const isAuto = job.recommendation === 'AUTO_APPLY';
      
      card.className = `bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-md space-y-3`;
      
      const badgeBg = isAuto ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30';
      const progressBg = isAuto ? 'bg-emerald-400' : 'bg-amber-400';

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div>
            <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-sky-500/10 text-sky-400 border border-sky-500/20 mb-1">${job.company}</span>
            <h2 class="text-base font-bold text-[var(--foreground)] leading-snug">${job.title}</h2>
            <p class="text-xs text-[var(--muted-foreground)] font-medium">${job.comp} • ${job.location}</p>
          </div>
          <span class="shrink-0 text-xs font-extrabold px-2.5 py-1 rounded-full border ${badgeBg}">${job.score}% Fit</span>
        </div>

        <div>
          <div class="w-full bg-[var(--border)] h-1.5 rounded-full overflow-hidden">
            <div class="${progressBg} h-full rounded-full" style="width: ${job.score}%"></div>
          </div>
        </div>

        <!-- Tab Navigation Buttons -->
        <div class="flex gap-1.5 pt-2 border-t border-[var(--border)] text-[11px] font-semibold overflow-x-auto">
          <button onclick="switchTab('tab-outreach-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} active text-sky-400 border-b-2 border-sky-400 pb-1">Direct InMail</button>
          <button onclick="switchTab('tab-resume-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} text-[var(--muted-foreground)] hover:text-white pb-1">Full Resume</button>
          <button onclick="switchTab('tab-cover-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} text-[var(--muted-foreground)] hover:text-white pb-1">Cover Letter</button>
          <button onclick="switchTab('tab-brief-${idx}', this, 'card-${idx}')" class="tab-btn-${idx} text-[var(--muted-foreground)] hover:text-white pb-1">Agent Disclosure Brief</button>
        </div>

        <!-- Tab Contents Container -->
        <div id="card-${idx}" class="pt-2">
          
          <!-- Tab 1: Outreach InMail -->
          <div id="tab-outreach-${idx}" class="tab-content active space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-[var(--muted-foreground)]">
              <span>Target: <strong class="text-sky-400">${job.contact}</strong></span>
              <button onclick="copyText('inmail-${idx}', this)" class="bg-emerald-500 text-slate-950 font-bold px-2.5 py-1 rounded text-[11px] hover:bg-emerald-400">Copy InMail</button>
            </div>
            <textarea id="inmail-${idx}" readonly class="w-full bg-slate-900 text-slate-200 p-2.5 rounded-xl border border-[var(--border)] font-mono text-[11px] leading-relaxed h-28 focus:outline-none">${job.inmailText}</textarea>
          </div>

          <!-- Tab 2: Full Resume -->
          <div id="tab-resume-${idx}" class="tab-content space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-[var(--muted-foreground)]">
              <span>ATS Modified Resume</span>
              <button onclick="copyText('resume-${idx}', this)" class="bg-sky-500 text-slate-950 font-bold px-2.5 py-1 rounded text-[11px] hover:bg-sky-400">Copy Full Resume</button>
            </div>
            <textarea id="resume-${idx}" readonly class="w-full bg-slate-900 text-slate-200 p-2.5 rounded-xl border border-[var(--border)] font-mono text-[10px] leading-relaxed h-44 focus:outline-none">${job.fullResume}</textarea>
          </div>

          <!-- Tab 3: Cover Letter -->
          <div id="tab-cover-${idx}" class="tab-content space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-[var(--muted-foreground)]">
              <span>Human-Authentic Cover Letter (No AI Cliches)</span>
              <button onclick="copyText('cover-${idx}', this)" class="bg-purple-500 text-white font-bold px-2.5 py-1 rounded text-[11px] hover:bg-purple-400">Copy Cover Letter</button>
            </div>
            <textarea id="cover-${idx}" readonly class="w-full bg-slate-900 text-slate-200 p-2.5 rounded-xl border border-[var(--border)] font-mono text-[10px] leading-relaxed h-44 focus:outline-none">${job.fullCoverLetter}</textarea>
          </div>

          <!-- Tab 4: Agent Disclosure Brief -->
          <div id="tab-brief-${idx}" class="tab-content space-y-2 text-xs">
            <div class="flex justify-between items-center text-[11px] text-purple-300">
              <span>Translucent Agent Alignment Note</span>
              <button onclick="copyText('brief-${idx}', this)" class="bg-purple-600 text-white font-bold px-2.5 py-1 rounded text-[11px] hover:bg-purple-500">Copy Agent Note</button>
            </div>
            <textarea id="brief-${idx}" readonly class="w-full bg-slate-950 text-purple-200 p-2.5 rounded-xl border border-purple-500/30 font-mono text-[10px] leading-relaxed h-28 focus:outline-none">Note on this submission: This evaluation and alignment brief was generated by a custom agentic pipeline I architected using Claude Code and Antigravity, calibrated with proprietary execution taxonomies. I use it to audit complex job descriptions against my actual 88,000 LOC operational background to ensure a ${job.score}% fidelity match before human review.</textarea>
          </div>

        </div>
      `;
      return card;
    }

    function switchTab(tabId, btn, cardContainerId) {
      const container = document.getElementById(cardContainerId);
      if (!container) return;
      
      const contents = container.querySelectorAll('.tab-content');
      contents.forEach(c => c.classList.remove('active'));
      
      const btns = btn.parentElement.querySelectorAll('button');
      btns.forEach(b => {
        b.classList.remove('active', 'text-sky-400', 'border-b-2', 'border-sky-400');
        b.classList.add('text-[var(--muted-foreground)]');
      });

      btn.classList.add('active', 'text-sky-400', 'border-b-2', 'border-sky-400');
      btn.classList.remove('text-[var(--muted-foreground)]');

      const targetTab = document.getElementById(tabId);
      if (targetTab) targetTab.classList.add('active');
    }

    function copyText(id, btn) {
      const textarea = document.getElementById(id);
      if (textarea) {
        textarea.select();
        document.execCommand('copy');
        const origText = btn.innerText;
        btn.innerText = 'Copied! ✓';
        setTimeout(() => { btn.innerText = origText; }, 2000);
      }
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-[var(--primary)]', 'text-[var(--primary-foreground)]');
        b.classList.add('bg-[var(--card)]', 'text-[var(--muted-foreground)]');
      });
      
      if (cat === 'all') document.getElementById('btn-all').className = 'filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all';
      if (cat === 'AUTO_APPLY') document.getElementById('btn-auto').className = 'filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all';
      if (cat === 'REVIEW') document.getElementById('btn-rev').className = 'filter-btn bg-[var(--primary)] text-[var(--primary-foreground)] px-3.5 py-1.5 rounded-full transition-all';

      if (currentData) renderDashboard(currentData);
    }

    function parseJobsFromDigest(md) {
      const jobs = [];
      const sections = md.split(/### \d+\./);
      
      sections.forEach((sec, idx) => {
        if (idx === 0) return;
        
        const titleMatch = sec.match(/^(.*?)\n/);
        const titleLine = titleMatch ? titleMatch[1].trim() : "Target Opportunity";
        const parts = titleLine.split('@');
        const title = parts[0] ? parts[0].trim() : "Target Position";
        const company = parts[1] ? parts[1].trim() : "Remote Enterprise";

        const compMatch = sec.match(/Estimated Comp:\*\*\s*(.*?)\|/);
        const comp = compMatch ? compMatch[1].trim() : "$250,000 Total Comp";

        const locMatch = sec.match(/Location:\*\*\s*(.*?)\n/);
        const location = locMatch ? locMatch[1].trim() : "Remote - US";

        const scoreMatch = sec.match(/Fit Score:\*\*\s*\*\*(\d+)%\*\*/);
        const score = scoreMatch ? parseInt(scoreMatch[1]) : 88;

        const recMatch = sec.match(/Recommendation:\s*`(.*?)`/);
        const recommendation = recMatch ? recMatch[1] : (score >= 80 ? "AUTO_APPLY" : "REVIEW");

        const contactMatch = sec.match(/Suggested Hiring Manager Contact:\*\*\s*`(.*?)`/);
        const contact = contactMatch ? contactMatch[1] : "VP of Product / CTO";

        const inmailMatch = sec.match(/```text\n([\s\S]*?)\n```/);
        const inmailText = inmailMatch ? inmailMatch[1].trim() : `Hi [Hiring Manager], I noticed ${company} is hiring for ${title}...`;

        const fullResume = `# Sylvester Floyd Carter IV
AI Systems Architect & Executive Strategy Leader | Atlanta, GA (Targeting Remote)

## EXECUTIVE SUMMARY
Executive Strategy Leader and AI Systems Architect with 20+ years of multi-million dollar P&L leadership, media strategy, and hands-on AI product orchestration. Directed AI agents (Antigravity & Claude Code) to build, test, and deploy 88,000+ lines of production microservice code across media streaming (BrijStream) and AI governance (Kyvryn/Themis). Author of 3 patent applications in autonomous media synchronization and instant split settlement.

## KEY MATCH PROOFS FOR ${title.toUpperCase()} AT ${company.toUpperCase()}
- Executive Strategy: Sanctuary Group Director of Strategy & P&L Leadership
- AI Code Telemetry: 88,000 LOC, 455/456 unit tests passed in Antigravity/Claude Code
- Domain & IP Fit: Patent PMG-2025-001 & Royalty Split Ledgers

## RELEVANT EXPERIENCE

### Co-Founder & AI Systems Architect | BrijStream / Kyvryn (2019 – Present)
- Directed architectural blueprint and prompt orchestration for dual multi-sided streaming and AI governance platforms spanning 88,000+ lines of code.
- Maintained 455/456 passing automated unit test suite.
- Formulated and filed patent applications for autonomous scene-scoring algorithms matching audio energy, mood, and tempo under speech dialogue.

### Director of Strategy | Music World / Sanctuary Group (2004 – 2006)
- Managed multi-million dollar P&L operations, corporate media licensing, and global artist catalog monetization.

### Founder & CEO | Yysman, Inc. (1999 – 2004)
- Founded tech enterprise from inception through successful corporate acquisition.

## EDUCATION & PATENTS
- BA in Finance, Clark Atlanta University
- Patents: Provisional PMG-2025-001 (Autonomous Media Sync), Dynamic Soundtrack Substitution, Instant Split Payments`;

        const fullCoverLetter = `Dear Hiring Team at ${company},

I am writing to express my strong interest in the ${title} role.

What sets my background apart is the combination of senior executive P&L leadership and direct hands-on AI systems architecture. Having served as Director of Strategy at Music World / Sanctuary Group managing multi-million dollar P&L portfolios, I understand product strategy from a commercial standpoint. At the same time, I actively direct AI agents using Antigravity and Claude Code to build, test, and deploy production software.

Recently, I architected and built an 88,000-line multi-sided media platform and AI governance proxy engine that maintains 455 passing unit tests out of 456, alongside authoring patent applications for autonomous audio-scene synchronization algorithms.

I respect ${company}'s work in this space and would welcome the opportunity to discuss how my strategic background and AI building capabilities can contribute directly to your product roadmap.

Sincerely,

Sylvester Floyd Carter IV
AI Systems Architect & Executive Strategy Leader`;

        jobs.push({
          title, company, comp, location, score, recommendation, contact, inmailText, fullResume, fullCoverLetter
        });
      });

      return jobs;
    }

    fetchDigest();
  </script>
</body>
</html>
